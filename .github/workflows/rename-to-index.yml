name: Rename website to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          rm -f index.html
          mv gps-koz-kalay-school-website.html index.html
          git config user.name "fahadkz155"
          git config user.email "fahadkz155@users.noreply.github.com"
          git add -A
          git commit -m "Add Iqbal Day 9 Nov closure notice" || echo "Nothing to commit"
          git push
